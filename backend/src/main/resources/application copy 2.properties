spring.application.name=sisaudin
server.port=8080

#CHAVES-VALOR
sisaudin.link=https://sisaudin.ghc.com.br:8080/login

#CONFIGURACOES - BANCO DE DADOS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost/sisaudin_novo_v10?zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql

#CONFIGURACOES - Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Security
spring.security.user.name=root
spring.security.user.password=mysql

