<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notificação de Relatório</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333333; line-height: 1.6;">

    <div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #dddddd;">
        <h2 style="color: #0056b3;">Olá, <span th:text="${nomeUser}">Usuário</span>!</h2>
        
        <p>Informamos que o relatório de auditoria referente à unidade 
           <strong th:text="${unidadeHospitalar}">[Nome da Unidade]</strong> foi gerado.</p>
        
        <p>Status do processo: <span th:text="${statusProcesso}">Pendente</span>.</p>
        
        <hr style="border: 0; border-top: 1px solid #eeeeee; margin: 20px 0;">
        
        <p style="font-size: 12px; color: #777777;">
            Esta é uma mensagem automática enviada em <span th:text="${dataGeracao}">00/00/0000</span>. Por favor, não responda.
        </p>
    </div>

</body>
</html>
