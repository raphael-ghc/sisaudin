spring.application.name=sisaudin
server.port=443

# O BD vai procurar a variável DB_HOST. Se não achar, usa localhost
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}/sisaudin_novo_v9?zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true

# Mesma lógica para o link do frontend
sisaudin.link=http://${APP_HOST:localhost}:5173/login

#CONFIGURACOES - BANCO DE DADOS
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#spring.datasource.url=jdbc:mysql://localhost/sisaudin_novo_v9?zeroDateTimeBehavior=CONVERT_TO_NULL&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql

#CONFIGURACOES - Hibernate / JPA settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Security
spring.security.user.name=root
spring.security.user.password=mysql

