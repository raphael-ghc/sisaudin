# ============ Sisaudin - HOMOLOGACAO: nginx na frente ============
# Front (build do Vite) servido pelo nginx; /api e /uploads repassados ao backend (JAR).
# Copiar para C:\nginx\conf\nginx.conf (guardar antes o original) e trocar os TROCAR_*.
# No Windows, caminhos com barra normal (/). Testar com: nginx.exe -t

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    gzip       on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  TROCAR_NOME_DO_SERVIDOR;   # ex.: sisaudin-hml.ghc.com.br, ou localhost

        # O backend aceita anexos de ate 50 MB; o padrao do nginx e 1 MB
        client_max_body_size 50m;

        # Build do front: conteudo de frontend/dist gerado com --mode nginx
        root   C:/sisaudin-homolog/frontend;
        index  index.html;

        # Rotas do React: F5 em tela interna devolve o index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # index.html sem cache, para o navegador pegar o build novo apos cada publicacao
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Arquivos do build tem hash no nome: podem ficar em cache
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
        }

        # API e arquivos enviados (fotos de perfil, anexos) vao para o backend
        location ~ ^/(api|uploads)/ {
            proxy_pass         http://127.0.0.1:8081;    # = server.port do application.properties
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;                     # geracao de PDF pode demorar
        }

        error_page   502 503 504  /50x.html;
        location = /50x.html {
            root   C:/nginx/html;
        }
    }

    # HTTPS (opcional): trocar "listen 80" por:
    #   listen 443 ssl;
    #   ssl_certificate      C:/nginx/conf/TROCAR.crt;
    #   ssl_certificate_key  C:/nginx/conf/TROCAR.key;
    # e ajustar sisaudin.link no application.properties para https://.
}
