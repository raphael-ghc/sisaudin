<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCore Audit | Funcionalidades</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --color-primary: #1e293b; /* Slate 800 */
            --color-accent: #d97706; /* Amber 600 */
            --color-bg: #f8fafc; /* Slate 50 */
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--color-bg);
            color: var(--color-primary);
            overflow-x: hidden;
        }

        .font-serif-title {
            font-family: 'Playfair Display', serif;
        }

        /* Animações do Carrossel */
        .slide-enter {
            opacity: 0;
            transform: translateX(30px) scale(0.98);
        }
        .slide-enter-active {
            opacity: 1;
            transform: translateX(0) scale(1);
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .slide-exit {
            opacity: 1;
            transform: translateX(0) scale(1);
        }
        .slide-exit-active {
            opacity: 0;
            transform: translateX(-30px) scale(0.98);
            transition: opacity 0.4s ease, transform 0.4s ease;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
        }

        /* Estilização dos Pontinhos */
        .dot {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 10px;
            height: 10px;
            background-color: #cbd5e1; /* slate-300 */
            border-radius: 9999px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .dot:hover {
            background-color: #94a3b8; /* slate-400 */
        }
        .dot.active {
            width: 32px;
            background-color: var(--color-accent);
        }

        /* Elementos Visuais SVG */
        .svg-container svg {
            width: 100%;
            height: 100%;
            drop-shadow: 0 20px 30px rgba(0,0,0,0.05);
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        .floating-delay {
            animation: float 6s ease-in-out infinite 2s;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-8 bg-gradient-to-br from-slate-50 to-slate-200">

    <main class="w-full max-w-6xl bg-white rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative min-h-[600px] border border-slate-100">
        
        <!-- Área Visual (Esquerda) -->
        <div class="w-full md:w-1/2 bg-slate-50 p-8 sm:p-12 relative flex items-center justify-center overflow-hidden border-r border-slate-100">
            <!-- Padrão de fundo sutil -->
            <div class="absolute inset-0 opacity-20" style="background-image: radial-gradient(#94a3b8 1px, transparent 1px); background-size: 20px 20px;"></div>
            
            <!-- Contêiner dinâmico do SVG -->
            <div id="visual-container" class="relative z-10 w-full max-w-md aspect-square svg-container transition-all duration-500">
                <!-- SVG inserido via JS -->
            </div>
        </div>

        <!-- Área de Conteúdo (Direita) -->
        <div class="w-full md:w-1/2 p-8 sm:p-12 lg:p-16 flex flex-col justify-between bg-white relative">
            
            <!-- Marca d'água de Passo -->
            <div id="step-watermark" class="absolute top-8 right-8 text-8xl font-black text-slate-50 opacity-50 select-none transition-all duration-500">01</div>

            <div class="relative z-10 mt-8 md:mt-12">
                <span id="slide-tag" class="inline-block py-1 px-3 rounded-full bg-amber-100 text-amber-700 text-xs font-bold tracking-widest uppercase mb-6 transition-all duration-300">Organização</span>
                
                <h2 id="slide-title" class="text-3xl sm:text-4xl lg:text-5xl font-serif-title text-slate-800 leading-tight mb-6 transition-all duration-500">
                    Facilitar a organização e centralização dos documentos de auditoria.
                </h2>
                
                <p id="slide-desc" class="text-lg text-slate-500 leading-relaxed transition-all duration-500">
                    Elimine a dispersão de informações. Centralize todas as evidências, relatórios e processos em um único repositório inteligente, garantindo que sua equipe encontre o que precisa instantaneamente.
                </p>
            </div>

            <!-- Navegação Inferior -->
            <div class="flex items-center justify-between mt-12 pt-8 border-t border-slate-100 relative z-10">
                <!-- Pontinhos (Dots) -->
                <div class="flex items-center space-x-3" id="dots-container">
                    <!-- Gerados via JS -->
                </div>

                <!-- Botões Prev/Next -->
                <div class="flex space-x-2">
                    <button id="btn-prev" class="w-12 h-12 rounded-full border border-slate-200 flex items-center justify-center text-slate-400 hover:text-slate-800 hover:border-slate-800 hover:bg-slate-50 transition-all focus:outline-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    </button>
                    <button id="btn-next" class="w-12 h-12 rounded-full bg-slate-800 text-white flex items-center justify-center hover:bg-amber-600 shadow-lg hover:shadow-amber-600/30 transition-all focus:outline-none group">
                        <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Dados dos slides com os SVGs desenhados e textos específicos
        const slides = [
            {
                id: 1,
                tag: "Eficiência",
                title: "Facilitar a organização e centralização dos documentos de auditoria.",
                desc: "Aumente a produtividade da sua equipe. Nosso repositório inteligente consolida todos os arquivos, tornando a busca, a organização e o arquivamento de auditorias um processo natural e livre de estresse.",
                // SVG: Pessoa Feliz (Sorriso claro) organizando pastas perfeitamente
                svg: `
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#fef3c7;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#fde68a;stop-opacity:1" />
                            </linearGradient>
                            <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="0" dy="10" stdDeviation="15" flood-opacity="0.1"/>
                            </filter>
                        </defs>
                        <!-- Fundo Decorativo -->
                        <circle cx="200" cy="200" r="150" fill="url(#grad1)" opacity="0.5"/>
                        
                        <!-- Pessoa Feliz (Busto) -->
                        <g class="floating">
                            <!-- Corpo -->
                            <path d="M120 320 C120 260, 280 260, 280 320 L280 380 L120 380 Z" fill="#1e293b" />
                            <!-- Pescoço -->
                            <rect x="180" y="190" width="40" height="30" fill="#fca5a5" />
                            <!-- Cabeça -->
                            <circle cx="200" cy="150" r="50" fill="#fecaca" />
                            <!-- Rosto Feliz -->
                            <!-- Olhos -->
                            <circle cx="185" cy="140" r="4" fill="#0f172a" />
                            <circle cx="215" cy="140" r="4" fill="#0f172a" />
                            <!-- Sorriso Grande e Feliz -->
                            <path d="M180 160 Q200 180, 220 160" stroke="#0f172a" stroke-width="4" stroke-linecap="round" fill="none" />
                            <path d="M220 160 Q200 190, 180 160 Z" fill="#ef4444" opacity="0.8" />
                            <!-- Cabelo Moderno -->
                            <path d="M150 150 C150 90, 250 90, 250 150 C260 140, 260 120, 230 100 C200 80, 150 100, 150 150 Z" fill="#0f172a" />
                        </g>

                        <!-- Pastas Flutuantes Organizadas -->
                        <g class="floating-delay" filter="url(#shadow)">
                            <!-- Pasta 1 (Direita Superior) -->
                            <g transform="translate(260, 80) rotate(15)">
                                <path d="M0 10 L20 10 L30 20 L80 20 L80 70 L0 70 Z" fill="#d97706" />
                                <rect x="5" y="25" width="70" height="40" fill="#fffbeb" />
                                <line x1="15" y1="35" x2="65" y2="35" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                                <line x1="15" y1="45" x2="45" y2="45" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
                            </g>
                            <!-- Pasta 2 (Esquerda Superior) -->
                            <g transform="translate(60, 100) rotate(-10)">
                                <path d="M0 10 L20 10 L30 20 L80 20 L80 70 L0 70 Z" fill="#059669" />
                                <rect x="5" y="25" width="70" height="40" fill="#ecfdf5" />
                                <line x1="15" y1="35" x2="65" y2="35" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
                                <line x1="15" y1="45" x2="55" y2="45" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
                            </g>
                            <!-- Arquivo com Check (Símbolo de Organização) -->
                            <g transform="translate(80, 220) rotate(-5)">
                                <rect x="0" y="0" width="60" height="80" fill="white" rx="4" />
                                <path d="M40 0 L60 20 L60 80 L0 80 L0 0 Z" fill="white" />
                                <polygon points="40,0 60,20 40,20" fill="#e2e8f0" />
                                <circle cx="30" cy="45" r="15" fill="#10b981" />
                                <path d="M22 45 L28 51 L38 39" stroke="white" stroke-width="3" stroke-linecap="round" fill="none" />
                            </g>
                        </g>
                    </svg>
                `
            },
            {
                id: 2,
                tag: "Conexões",
                title: "Associe papéis de trabalho a cada documento.",
                desc: "Facilidade incomparável para vincular anexos, criar notas explicativas e estabelecer referências cruzadas. Mantenha as evidências atreladas diretamente aos testes, criando uma trilha de auditoria à prova de falhas.",
                // SVG: Documento central com vários anexos e clipes gigantes evidenciando a "associação"
                svg: `
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <filter id="docShadow" x="-10%" y="-10%" width="120%" height="120%">
                                <feDropShadow dx="5" dy="15" stdDeviation="10" flood-opacity="0.08"/>
                            </filter>
                        </defs>
                        <!-- Fundo Decorativo -->
                        <circle cx="200" cy="200" r="160" fill="#f1f5f9" opacity="0.8"/>
                        
                        <!-- Documento Principal (Papel de Trabalho) -->
                        <g class="floating" filter="url(#docShadow)" transform="translate(110, 70)">
                            <rect x="0" y="0" width="180" height="260" fill="white" rx="8" />
                            <!-- Header do documento -->
                            <rect x="20" y="30" width="140" height="40" fill="#f8fafc" rx="4" />
                            <rect x="30" y="45" width="80" height="10" fill="#cbd5e1" rx="5" />
                            <!-- Linhas de texto -->
                            <rect x="20" y="90" width="140" height="6" fill="#e2e8f0" rx="3" />
                            <rect x="20" y="110" width="120" height="6" fill="#e2e8f0" rx="3" />
                            <rect x="20" y="130" width="130" height="6" fill="#e2e8f0" rx="3" />
                            <!-- Bloco de evidência -->
                            <rect x="20" y="160" width="140" height="60" fill="#fffbeb" rx="4" stroke="#fde68a" stroke-width="2"/>
                            <circle cx="40" cy="190" r="8" fill="#fbbf24" />
                            <rect x="60" y="187" width="80" height="6" fill="#fcd34d" rx="3" />
                        </g>

                        <!-- Anexo 1 (Imagem/Gráfico) à esquerda -->
                        <g class="floating-delay" filter="url(#docShadow)" transform="translate(30, 150) rotate(-15)">
                            <rect x="0" y="0" width="100" height="100" fill="white" rx="6" />
                            <rect x="10" y="10" width="80" height="60" fill="#e0f2fe" rx="4" />
                            <circle cx="50" cy="40" r="15" fill="#38bdf8" />
                            <rect x="10" y="80" width="60" height="6" fill="#cbd5e1" rx="3" />
                            
                            <!-- Clipe de Papel Conectando -->
                            <g transform="translate(80, 10) rotate(45)">
                                <path d="M10 30 L10 10 C10 0, 25 0, 25 10 L25 40 C25 55, 0 55, 0 40 L0 5 C0 -10, 35 -10, 35 5 L35 30" 
                                      fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        </g>

                        <!-- Anexo 2 (Planilha) à direita -->
                        <g class="floating" filter="url(#docShadow)" transform="translate(250, 180) rotate(10)" style="animation-duration: 7s;">
                            <rect x="0" y="0" width="110" height="120" fill="white" rx="6" />
                            <!-- Células da planilha -->
                            <rect x="10" y="10" width="90" height="20" fill="#dcfce7" rx="2" />
                            <rect x="10" y="35" width="42" height="15" fill="#f1f5f9" rx="2" />
                            <rect x="58" y="35" width="42" height="15" fill="#f1f5f9" rx="2" />
                            <rect x="10" y="55" width="42" height="15" fill="#f1f5f9" rx="2" />
                            <rect x="58" y="55" width="42" height="15" fill="#f1f5f9" rx="2" />
                            <rect x="10" y="75" width="90" height="15" fill="#f1f5f9" rx="2" />
                            
                            <!-- Clipe de Papel Conectando -->
                            <g transform="translate(-15, 20) rotate(-60)">
                                <path d="M10 30 L10 10 C10 0, 25 0, 25 10 L25 40 C25 55, 0 55, 0 40 L0 5 C0 -10, 35 -10, 35 5 L35 30" 
                                      fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                            </g>
                        </g>
                    </svg>
                `
            },
            {
                id: 3,
                tag: "Governança",
                title: "Segregação de funções com papéis e regras bem definidos.",
                desc: "Assegure a integridade dos processos de auditoria. Defina precisamente quem pode visualizar, editar, aprovar ou excluir informações através de uma matriz de responsabilidades e controle de acesso rigoroso.",
                // SVG: Avatares representando perfis diferentes, conectados a matriz de permissões/cadeados
                svg: `
                    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
                        <!-- Fundo Decorativo Linhas (Network) -->
                        <path d="M100 200 L200 120 L300 200 L200 300 Z" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="5,5"/>
                        <path d="M200 120 L200 200" fill="none" stroke="#e2e8f0" stroke-width="2"/>
                        
                        <!-- Usuário 1: Administrador / Aprovador (Topo) -->
                        <g class="floating" transform="translate(160, 50)">
                            <circle cx="40" cy="40" r="40" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
                            <!-- Avatar -->
                            <circle cx="40" cy="25" r="12" fill="#1e293b" />
                            <path d="M20 55 C20 40, 60 40, 60 55 Z" fill="#1e293b" />
                            <!-- Escudo (Poder Total) -->
                            <path d="M60 10 L80 10 L80 30 C80 50, 70 60, 60 70 C50 60, 40 50, 40 30 L40 10 Z" fill="#d97706" transform="translate(0, 10) scale(0.6)" />
                            <path d="M55 40 L60 45 L70 30" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" transform="translate(0, 10) scale(0.6)"/>
                        </g>

                        <!-- Usuário 2: Auditor / Edição (Esquerda) -->
                        <g class="floating-delay" transform="translate(60, 160)">
                            <circle cx="40" cy="40" r="40" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
                            <circle cx="40" cy="25" r="12" fill="#64748b" />
                            <path d="M20 55 C20 40, 60 40, 60 55 Z" fill="#64748b" />
                            <!-- Ícone de Lápis (Edição) -->
                            <circle cx="70" cy="60" r="14" fill="#0ea5e9" />
                            <path d="M66 64 L64 66 L66 60 L72 54 L76 58 Z" fill="white" />
                        </g>

                        <!-- Usuário 3: Visitante / Restrito (Direita) -->
                        <g class="floating" transform="translate(260, 160)" style="animation-duration: 5s;">
                            <circle cx="40" cy="40" r="40" fill="white" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
                            <circle cx="40" cy="25" r="12" fill="#94a3b8" />
                            <path d="M20 55 C20 40, 60 40, 60 55 Z" fill="#94a3b8" />
                            <!-- Cadeado (Acesso de Leitura/Restrito) -->
                            <circle cx="10" cy="60" r="14" fill="#ef4444" />
                            <rect x="6" y="58" width="8" height="6" fill="white" rx="1" />
                            <path d="M7 58 L7 55 C7 52, 13 52, 13 55 L13 58" fill="none" stroke="white" stroke-width="1.5" />
                        </g>

                        <!-- Tabela de Regras Simbólica (Base) -->
                        <g transform="translate(100, 260)" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.05))">
                            <rect x="0" y="0" width="200" height="90" fill="white" rx="8" />
                            <!-- Cabeçalho -->
                            <rect x="0" y="0" width="200" height="25" fill="#f8fafc" rx="8" />
                            <rect x="20" y="10" width="40" height="5" fill="#cbd5e1" rx="2" />
                            <rect x="100" y="10" width="80" height="5" fill="#cbd5e1" rx="2" />
                            <!-- Linha 1 -->
                            <rect x="20" y="40" width="30" height="4" fill="#94a3b8" rx="2" />
                            <circle cx="110" cy="42" r="4" fill="#10b981" />
                            <circle cx="140" cy="42" r="4" fill="#10b981" />
                            <circle cx="170" cy="42" r="4" fill="#10b981" />
                            <!-- Linha 2 -->
                            <rect x="20" y="60" width="40" height="4" fill="#94a3b8" rx="2" />
                            <circle cx="110" cy="62" r="4" fill="#10b981" />
                            <circle cx="140" cy="62" r="4" fill="#10b981" />
                            <circle cx="170" cy="62" r="4" fill="#ef4444" />
                            <!-- Linha 3 -->
                            <rect x="20" y="80" width="25" height="4" fill="#94a3b8" rx="2" />
                            <circle cx="110" cy="82" r="4" fill="#10b981" />
                            <circle cx="140" cy="82" r="4" fill="#ef4444" />
                            <circle cx="170" cy="82" r="4" fill="#ef4444" />
                        </g>
                    </svg>
                `
            }
        ];

        let currentIndex = 0;
        let isAnimating = false;

        // Elementos do DOM
        const visualContainer = document.getElementById('visual-container');
        const tagEl = document.getElementById('slide-tag');
        const titleEl = document.getElementById('slide-title');
        const descEl = document.getElementById('slide-desc');
        const watermarkEl = document.getElementById('step-watermark');
        const dotsContainer = document.getElementById('dots-container');

        function initCarousel() {
            // Criar pontinhos
            slides.forEach((_, index) => {
                const dot = document.createElement('div');
                dot.className = `dot ${index === 0 ? 'active' : ''}`;
                dot.setAttribute('aria-label', `Ir para o slide ${index + 1}`);
                dot.onclick = () => goToSlide(index);
                dotsContainer.appendChild(dot);
            });

            // Adicionar eventos aos botões
            document.getElementById('btn-prev').addEventListener('click', prevSlide);
            document.getElementById('btn-next').addEventListener('click', nextSlide);

            // Renderizar o primeiro slide
            renderSlide(currentIndex, false);
        }

        function renderSlide(index, animate = true) {
            if (animate) isAnimating = true;
            const slide = slides[index];

            // Atualiza Pontinhos
            Array.from(dotsContainer.children).forEach((dot, i) => {
                dot.className = `dot ${i === index ? 'active' : ''}`;
            });

            if (animate) {
                // Classe de saída para os elementos de texto
                tagEl.style.opacity = '0';
                titleEl.style.opacity = '0';
                descEl.style.opacity = '0';
                titleEl.style.transform = 'translateY(10px)';
                descEl.style.transform = 'translateY(10px)';
                
                // Animação do SVG
                visualContainer.style.opacity = '0';
                visualContainer.style.transform = 'scale(0.95)';

                setTimeout(() => {
                    updateContent(slide);
                    
                    // Entrada suave
                    tagEl.style.opacity = '1';
                    titleEl.style.opacity = '1';
                    descEl.style.opacity = '1';
                    titleEl.style.transform = 'translateY(0)';
                    descEl.style.transform = 'translateY(0)';
                    
                    visualContainer.style.opacity = '1';
                    visualContainer.style.transform = 'scale(1)';
                    
                    setTimeout(() => { isAnimating = false; }, 500);
                }, 300);
            } else {
                updateContent(slide);
            }
        }

        function updateContent(slide) {
            tagEl.textContent = slide.tag;
            titleEl.textContent = slide.title;
            descEl.textContent = slide.desc;
            watermarkEl.textContent = `0${slide.id}`;
            visualContainer.innerHTML = slide.svg;
        }

        function nextSlide() {
            if (isAnimating) return;
            currentIndex = (currentIndex + 1) % slides.length;
            renderSlide(currentIndex);
        }

        function prevSlide() {
            if (isAnimating) return;
            currentIndex = (currentIndex - 1 + slides.length) % slides.length;
            renderSlide(currentIndex);
        }

        function goToSlide(index) {
            if (isAnimating || index === currentIndex) return;
            currentIndex = index;
            renderSlide(currentIndex);
        }

        // Inicializa o carrossel quando o DOM estiver pronto
        document.addEventListener('DOMContentLoaded', initCarousel);
    </script>
</body>
</html>
